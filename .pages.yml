content:
  - name: recipes
    label: Recipes
    type: collection
    path: content/recipes
    filename: "{slug}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: slug
        label: Slug
        type: string
        required: true

      - name: tags
        label: Tags
        type: string
        list: true
        required: true

      - name: layout
        label: Layout
        type: string
        default: "layouts/recipe.njk"
        hidden: true

      - name: permalink
        label: Permalink
        type: string
        default: "/recipes/{{ slug }}/"
        hidden: true

      - name: ingredients
        label: Ingredients
        type: object
        list: true
        fields:
          - name: section
            label: Section
            type: string
          - name: items
            label: Items
            type: string
            list: true

      - name: steps
        label: Steps
        type: string
        list: true

      - name: references
        label: References
        type: object
        list: true
        fields:
          - name: slug
            label: Slug
            type: string
          - name: title
            label: Title
            type: string
          - name: type
            label: Type
            type: string
